matches:
  worlds_2024_final:
    metadata:
      tournament: "worlds_2024"
      match_date: "20241102"
      teams: "t1_blg"
    # 📺 전체 방송 타임라인 (시청자 봇이 참고할 기준)
    timeline:
      pre_game:
        start_seconds: 0
        duration: 55
        label: "PRE_GAME"
      g4:
        start_seconds: 55
        duration: 1902
        label: "T1_BLG_G4"
      intermission:
        start_seconds: 1957 # 55 + 1902
        duration: 1225      # 우리가 계산한 20분 25초!
        label: "INTERMISSION"
      g5:
        start_seconds: 3182 # 1957 + 1225
        duration: 1933
        label: "T1_BLG_G5"
      post_game:
        start_seconds: 5115
        duration: 600
        label: "POST_GAME"

    # 🎮 실제 게임 봇 실행 설정 (Airflow Relay용)
    data:
      local_path: "./data"
      chat_source: "t1_blg_chat.jsonl"  # 채팅은 통파일
      game_sets:
          g4:
            file_name: "t1_blg_g4_exact.json"
            wait_seconds: 55 # TODO: 55
            duration_seconds: 1902 # 31:42초  (경기진행시간)
          g5:
            file_name: "t1_blg_g5_exact.json"
            wait_seconds: 1225 # TODO: 3182-1902
            duration_seconds: 1933  # 32분 13초 (경기진행시간)