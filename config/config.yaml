# LoL Realtime Pipeline - AWS 리소스 및 시뮬레이션 설정
#
# 리소스 명명 규칙: {prefix}-{project}-{env}-{region_abbr}-{service}-{tier}-{data}
#
# 주의: 자격 증명(액세스 키, 마스터 비밀번호 등)은 이 파일에 저장하지 않는다.
#       모든 비밀 값은 .env 또는 AWS Secrets Manager를 통해 주입한다.

global:
  user_id: &user_id de-ai-05
  project: &project lol
  env: &env dev
  region: &region ap-northeast-2
  region_abbr: &an2 an2

resources:
  ingestion_streaming:
    kinesis_data_streams:
      # --- Bronze Layer
      chat_brz: "de-ai-05-lol-dev-an2-kds-brz-chat"
      game_brz: "de-ai-05-lol-dev-an2-kds-brz-game"
      viewer_brz: "de-ai-05-lol-dev-an2-kds-brz-viewer"
      # --- Gold Layer
      chat_gld: "de-ai-05-lol-dev-an2-kds-gld-chat"
      score_gld: "de-ai-05-lol-dev-an2-kds-gld-score"

    # Firehose는 Dynamic Partitioning으로 match_id 단위 파티션을 생성한다.
    # 파티션 키는 레코드 JSON의 .match_id를 JQ로 추출하여 p_match_id에 매핑한다.
    kinesis_data_firehose:
      # 채팅 데이터
      chat_brz_to_s3: "de-ai-05-lol-dev-an2-kdf-brz-chat"
      # Prefix: bronze/chat/p_match_id=!{partitionKeyFromQuery:p_match_id}/year=!{timestamp:yyyy}/month=!{timestamp:MM}/day=!{timestamp:dd}/hour=!{timestamp:HH}/
      # Error : bronze/errors/chat/!{firehose:error-output-type}/year=!{timestamp:YYYY}/month=!{timestamp:MM}/day=!{timestamp:dd}/
      # Buffer hints: 1MB / 60초

      # 게임 데이터
      game_brz_to_s3: "de-ai-05-lol-dev-an2-kdf-brz-game"
      # Prefix: bronze/game/p_match_id=!{partitionKeyFromQuery:p_match_id}/year=!{timestamp:YYYY}/month=!{timestamp:MM}/day=!{timestamp:dd}/hour=!{timestamp:HH}/
      # Error : bronze/errors/game/!{firehose:error-output-type}/year=!{timestamp:YYYY}/month=!{timestamp:MM}/day=!{timestamp:dd}/
      # Buffer hints: 1MB / 60초

  processing:
    # Managed Flink (Kinesis Data Analytics)
    flink_app: "de-ai-05-lol-dev-an2-flink-analyzer"
    studio_notebook: "de-ai-05-lol-dev-an2-stdo-analyzer"
    # Glue/Athena DB명은 하이픈 대신 언더바를 사용한다.
    glue_db: "de_ai_05_lol_dev_an2_glue_db"
    athena_db: "de_ai_05_lol_dev_an2_glue_db"
    tables:
      # Speed Layer
      spd_brz_chat: "spd_brz_chat_tbl"
      spd_brz_game: "spd_brz_game_tbl"
      spd_gld_s3_score: "spd_gld_s3_score_tbl"
      spd_gld_kds_score: "spd_gld_kds_score_tbl"
      spd_gld_kds_chat: "spd_gld_kds_chat_tbl"

      # Batch Layer
      btch_slv_game: "btch_slv_game_tbl"
      btch_slv_chat: "btch_slv_chat_tbl"
      btch_gld_report: "btch_gld_match_reports_tbl"

    # Bronze(JSON) -> Silver(Parquet) 변환 Glue Job
    # Type: Spark / Python 3 / Worker G.1X x2 / Timeout 15min / Retries 0
    glue_job_refiner: "de-ai-05-lol-dev-an2-glue-slv-refiner"

    # Gold 데이터를 OpenSearch로 적재하는 Lambda (Kinesis 트리거, 배치 크기 100)
    os_loader_lambda: "de-ai-05-lol-dev-an2-lmd-gld-os-loader"
    # 대시보드 조회 요청을 처리하는 Lambda (API Gateway 연동)
    api_hander_lambda: "de-ai-05-lol-dev-an2-lmd-gld-api-handler"

  storage_serving:
    # Data Lake (S3)
    s3_bucket: "de-ai-05-lol-an2-s3-datalake"
    # 정제된 채팅 검색 및 시각화 (도메인명 28자 제한)
    opensearch: "de-ai-05-lol-dev-an2-os-srsh"
    # 접근 정책은 Lambda 실행 역할로 Principal을 한정한다.
    # 마스터 자격 증명은 Secrets Manager에 보관하고 Lambda 환경 변수로 주입한다.
    # {
    #   "Version": "2012-10-17",
    #   "Statement": [
    #     {
    #       "Effect": "Allow",
    #       "Principal": {
    #         "AWS": "arn:aws:iam::<AWS_ACCOUNT_ID>:role/service-role/<os-loader-role>"
    #       },
    #       "Action": ["es:ESHttpGet", "es:ESHttpPost", "es:ESHttpPut"],
    #       "Resource": "arn:aws:es:ap-northeast-2:<AWS_ACCOUNT_ID>:domain/de-ai-05-lol-dev-an2-os-srsh/*"
    #     }
    #   ]
    # }
    # 역할 매핑은 OpenSearch Dashboards의 Security > Roles에서 설정한다.

    # 대시보드용 조회 API (GET /lol -> api_hander_lambda)
    api_gateway: "de-ai-05-lol-dev-an2-agw-gld-api"

  analytics:
    # S3 데이터에 대한 SQL 기반 분석
    athena_workgroup: "de-ai-05-lol-dev-an2-athena-wg"

# 프론트엔드가 호출할 서빙 엔드포인트.
# 배포 환경마다 다르므로 실제 값은 로컬에서 설정하며 저장소에는 포함하지 않는다.
serving_endpoint: "https://<api-id>.execute-api.ap-northeast-2.amazonaws.com/lol"

# 시뮬레이션 대상 경기 선택
app_context:
  active_match_key: "worlds_2024_final"  # 아래 matches에 등록된 키
  active_set: "g4"                       # g4 또는 g5
  refresh_interval_ms: 1000

# 경기 저장소: 새로운 경기를 추가할 때 이 아래에 같은 구조로 덧붙인다.
matches:
  worlds_2024_final:
    metadata:
      tournament: "worlds_2024"
      match_date: "20241102"
      teams: "t1_blg"

    # 전체 방송 타임라인 (시청자 봇의 구간 판정 기준)
    timeline:
      pre_game:
        start_seconds: 0
        duration: 55
        label: "PRE_GAME"
      g4:
        start_seconds: 55
        duration: 1902
        label: "T1_BLG_G4"
      intermission:
        start_seconds: 1957   # 55 + 1902
        duration: 1225        # 세트 간 휴식 20분 25초
        label: "INTERMISSION"
      g5:
        start_seconds: 3182   # 1957 + 1225
        duration: 1933
        label: "T1_BLG_G5"
      post_game:
        start_seconds: 5115
        duration: 600
        label: "POST_GAME"

    # 게임 봇 실행 설정 (수집 릴레이 DAG가 참조)
    data:
      local_path: "./data"
      chat_source: "t1_blg_chat.jsonl"   # 채팅은 시리즈 전체가 단일 파일
      game_sets:
        g4:
          file_name: "t1_blg_g4_exact.json"
          wait_seconds: 55
          duration_seconds: 1902         # 경기 진행 시간 31분 42초
        g5:
          file_name: "t1_blg_g5_exact.json"
          wait_seconds: 1225
          duration_seconds: 1933         # 경기 진행 시간 32분 13초
