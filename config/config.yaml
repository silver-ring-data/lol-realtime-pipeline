# lol-highlighter AWS Infrastructure Configuration (v1.2)
# Updated based on Academy Naming Convention: {user_id}-{project}-{env}-{region_abbr}-{service}-{tier}-{data}

global:
  user_id: &user_id de-ai-05
  project: &project lol
  env: &env dev
  region: &region ap-northeast-2
  region_abbr: &an2 an2

resources:
  ingestion_streaming:
    kinesis_data_streams:
      # --- Bronze Layer
      chat_brz: "de-ai-05-lol-dev-an2-kds-brz-chat"
      game_brz: "de-ai-05-lol-dev-an2-kds-brz-game"
      viewer_brz: "de-ai-05-lol-dev-an2-kds-brz-viewer"
      # --- Gold Layer
      chat_gld: "de-ai-05-lol-dev-an2-kds-gld-chat"
      score_gld: "de-ai-05-lol-dev-an2-kds-gld-score"
      


    kinesis_data_firehose: # Dynamic Partitioning
      # --- 💬 채팅 데이터 (Dynamic Partitioning 적용)
      chat_brz_to_s3: "de-ai-05-lol-dev-an2-kdf-brz-chat"
      # Prefix: bronze/chat/p_match_id=!{partitionKeyFromQuery:p_match_id}/year=!{timestamp:yyyy}/month=!{timestamp:MM}/day=!{timestamp:dd}/hour=!{timestamp:HH}/
      # p_match_id/.match_id
      # Error : bronze/errors/chat/!{firehose:error-output-type}/year=!{timestamp:YYYY}/month=!{timestamp:MM}/day=!{timestamp:dd}/
      # Buffer hints (버퍼 힌트) : 크기 1MB, 간격 60초

      # --- 🎮 게임 데이터 (Dynamic Partitioning 적용)
      game_brz_to_s3: "de-ai-05-lol-dev-an2-kdf-brz-game"
      # Prefix: bronze/game/p_match_id=!{partitionKeyFromQuery:p_match_id}/year=!{timestamp:YYYY}/month=!{timestamp:MM}/day=!{timestamp:dd}/hour=!{timestamp:HH}/
      # Error : bronze/errors/game/!{firehose:error-output-type}/year=!{timestamp:YYYY}/month=!{timestamp:MM}/day=!{timestamp:dd}/
      # Buffer hints (버퍼 힌트) : 크기 1MB, 간격 60초

      # Dynamic Partitioning: Enabled로 체크!
      # Multi-record de-aggregation: Disabled (우리 봇은 1개씩 쏘니까 상관없어).
      # New partition key:
      # Key 이름: p_match_id
      # JQ query: .match_id (우리 봇이 보내는 JSON 안에 match_id 필드가 있으니까!)
      # S3 bucket prefix: 위에서 우리가 정한 p_match_id=...가 포함된 경로를 그대로 입력!

  processing:
    # Managed Flink (Kinesis Data Analytics)
    flink_app: "de-ai-05-lol-dev-an2-flink-analyzer"
    studio_notebook: "de-ai-05-lol-dev-an2-stdo-analyzer"
    glue_db: "de_ai_05_lol_dev_an2_glue_db" # DB명은 하이픈(-) 대신 언더바(_) 권장
    athena_db: "de_ai_05_lol_dev_an2_glue_db"
    tables:
      # Speed Layer
      spd_brz_chat: "spd_brz_chat_tbl"
      spd_brz_game: "spd_brz_game_tbl"
      spd_gld_s3_score: "spd_gld_s3_score_tbl"
      spd_gld_kds_score: "spd_gld_kds_score_tbl"
      spd_gld_kds_chat: "spd_gld_kds_chat_tbl"

      # Batch Layer
      btch_slv_game: "btch_slv_game_tbl"   # 👈 요렇게!
      btch_slv_chat: "btch_slv_chat_tbl"
      btch_gld_report: "btch_gld_match_reports_tbl"
    # 🌟 Glue Job (우리가 이름 바꾼 그 녀석!)
    glue_job_refiner: "de-ai-05-lol-dev-an2-glue-slv-refiner"
    # TYPE          : Spark
    # Language      : python 3
    # glue version  : 가장 높은거
    # Worker type   : G.1X
    # Requested     : 2
    # Job timeout   : 15 (min)
    # retries       : 0


    # 🚀 [New] 통합 배달부 람다 추가
    os_loader_lambda: "de-ai-05-lol-dev-an2-lmd-gld-os-loader"
    # kinesis 연결해주기
    # 배치 기간 : 1
    # 배치 크기 : 100
    api_hander_lambda: "de-ai-05-lol-dev-an2-lmd-gld-api-handler"

    # 트리거 연결

  storage_serving:
    # Data Lake (S3)
    s3_bucket: "de-ai-05-lol-an2-s3-datalake"
    # Search & Visualization (OpenSearch) - 정제된 채팅 검색용
    opensearch: "de-ai-05-lol-dev-an2-os-srsh" # 28자 제한
    # id : de-ai-05-master
    # pw : Asdfqwer1234!
    # 정책 가져오기(json)
    # {
    #   "Version": "2012-10-17",
    #   "Statement": [
    #     {
    #       "Effect": "Allow",
    #       "Principal": {
    #         "AWS": "*"
    #       },
    #       "Action": "es:*",
    #       "Resource": "arn:aws:es:ap-northeast-2:000000000000:domain/de-ai-05-lol-dev-an2-os-srsh/*"
    #     }
    #   ]
    # }

    # arn:aws:iam::000000000000:role/service-role/de-ai-05-lol-dev-an2-lmd-gld-os-loader-role-e1zw7aen
    # arn:aws:iam::000000000000:role/service-role/de-ai-05-lol-dev-an2-lmd-gld-api-handler-role-j4z8evpb
    # opensearch dashboard에 접속하고 security -> roles
    api_gateway: "de-ai-05-lol-dev-an2-agw-gld-api"
    # IP 주소 유형 : IPv4
    # 통합 : Lambda 선택 -> de-ai-05-lol-dev-an2-lmd-gld-api-handler
    # 매서드 : GET
    # 리소스 경로 : /lol
    # 통합 -> 람다 함수 선택

  
  analytics:
    # SQL based analysis on S3
    athena_workgroup: "de-ai-05-lol-dev-an2-athena-wg"
# 🎯 [핵심] 현재 어떤 경기를 시뮬레이션할지 여기서만 선택!
serving_endpoint: "https://u4xlftet19.execute-api.ap-northeast-2.amazonaws.com/lol"
